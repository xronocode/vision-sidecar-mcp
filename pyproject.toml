[project]
name = "vision-sidecar-mcp"
version = "0.4.0"
description = "MCP server that gives AI agents vision capabilities via Ollama VLM"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "xronocode" },
]
keywords = ["mcp", "ollama", "vlm", "vision", "screenshot", "ui-analysis", "ocr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp[cli]>=1.6.0",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/xronocode/vision-sidecar-mcp"
Repository = "https://github.com/xronocode/vision-sidecar-mcp"
Issues = "https://github.com/xronocode/vision-sidecar-mcp/issues"

[project.scripts]
vision-sidecar = "vision_sidecar.server:main"
